---
# === AGENT ISO GENERATION ===
# Renders install-config.yaml and agent-config.yaml from templates, then invokes
# the Agent-Based Installer to produce a self-contained agent ISO.

- name: "Ensure install directory exists"
  ansible.builtin.file:
    path: "{{ install_dir }}"
    state: directory
    mode: "0750"

- name: "Template install-config.yaml"
  ansible.builtin.template:
    src: "install-config.yaml.j2"
    dest: "{{ install_dir }}/install-config.yaml"
    mode: "0640"

- name: "Template agent-config.yaml"
  ansible.builtin.template:
    src: "agent-config.yaml.j2"
    dest: "{{ install_dir }}/agent-config.yaml"
    mode: "0640"

- name: "Generate agent ISO"
  ansible.builtin.command:
    argv:
      - "{{ openshift_install_binary }}"
      - agent
      - create
      - image
      - "--dir"
      - "{{ install_dir }}"
      - "--log-level"
      - info
    creates: "{{ agent_iso_local_path }}"
  register: agent_iso_result
  changed_when: agent_iso_result.rc == 0

- name: "Confirm agent ISO was created"
  ansible.builtin.stat:
    path: "{{ agent_iso_local_path }}"
  register: iso_stat

- name: "Fail if agent ISO is missing"
  ansible.builtin.fail:
    msg: >-
      Agent ISO not found at {{ agent_iso_local_path }}. Check openshift-install
      output for errors.
  when: not iso_stat.stat.exists
