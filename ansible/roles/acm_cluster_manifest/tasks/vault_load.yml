---
# === VAULT SECRET LOAD (SPOKE) ===
# Push spoke cluster secrets into HashiCorp Vault so that ExternalSecret CRs
# on the hub can sync them as Kubernetes Secrets before ArgoCD reconciles.

- name: "Authenticate to Vault with root token"
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/auth/token/lookup-self"
    method: GET
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    validate_certs: false
    status_code: 200
  register: _vault_auth_check
  delegate_to: localhost

- name: "Verify global pull-secret exists in Vault"
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/{{ cluster.pull_secret_vault_path | regex_replace('^secret/', 'secret/data/') }}"
    method: GET
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    validate_certs: false
    status_code: 200
  register: _pull_secret_check
  delegate_to: localhost
  failed_when: _pull_secret_check.status != 200

- name: "Write spoke cluster metadata to Vault"
  ansible.builtin.uri:
    url: >-
      {{ vault_addr }}/v1/{{ cluster.cluster_vault_path_prefix
      | regex_replace('^secret/', 'secret/data/') }}/cluster-info
    method: POST
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      data:
        cluster_name: "{{ cluster.name }}"
        base_domain: "{{ cluster.base_domain }}"
        api_url: "https://api.{{ cluster.name }}.{{ cluster.base_domain }}:6443"
        console_url: >-
          https://console-openshift-console.apps.{{ cluster.name }}.{{ cluster.base_domain }}
    validate_certs: false
    status_code: [200, 204]
  delegate_to: localhost

- name: "Write node BMC credentials to Vault — {{ item.hostname }}"
  ansible.builtin.uri:
    url: >-
      {{ vault_addr }}/v1/{{ cluster.cluster_vault_path_prefix
      | regex_replace('^secret/', 'secret/data/') }}/bmc-{{ item.hostname }}
    method: POST
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      data:
        username: "{{ item.bmc.user }}"
        password: "{{ item.bmc.password }}"
        address: "{{ item.bmc.ip }}"
    validate_certs: false
    status_code: [200, 204]
  delegate_to: localhost
  loop: "{{ nodes }}"
  loop_control:
    label: "{{ item.hostname }}"
  no_log: true

- name: "Vault secret load complete for cluster {{ cluster.name }}"
  ansible.builtin.debug:
    msg: >-
      Spoke secrets loaded at {{ cluster.cluster_vault_path_prefix }}.
      ExternalSecrets on hub will sync on next refresh.
