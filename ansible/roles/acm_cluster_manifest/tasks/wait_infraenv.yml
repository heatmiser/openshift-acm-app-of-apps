---
# === WAIT FOR INFRAENV ISO ===
# Poll the InfrastructureEnv resource until the Assisted Installer service
# generates the discovery ISO and populates isoDownloadURL.

- name: "Poll InfrastructureEnv for isoDownloadURL — {{ cluster.name }}"
  kubernetes.core.k8s_info:
    api_version: agent-install.openshift.io/v1beta1
    kind: InfrastructureEnv
    name: "{{ cluster.name }}"
    namespace: "{{ cluster.name }}"
  register: _infraenv
  until: >-
    _infraenv.resources | length > 0 and
    _infraenv.resources[0].status is defined and
    _infraenv.resources[0].status.isoDownloadURL is defined and
    _infraenv.resources[0].status.isoDownloadURL != ""
  retries: "{{ cluster_onboard_infraenv_poll_retries }}"
  delay: "{{ cluster_onboard_infraenv_poll_delay }}"

- name: "Store discovery ISO URL"
  ansible.builtin.set_fact:
    spoke_discovery_iso_url: >-
      {{ _infraenv.resources[0].status.isoDownloadURL }}

- name: "Discovery ISO is ready"
  ansible.builtin.debug:
    msg: "Discovery ISO URL: {{ spoke_discovery_iso_url }}"
