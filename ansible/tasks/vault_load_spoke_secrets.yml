---
# === VAULT SECRET LOAD (SPOKE) ===
# Push spoke cluster secrets into HashiCorp Vault so that ExternalSecret CRs
# on the hub can sync them as Kubernetes Secrets before ArgoCD reconciles.
#
# Called at different pipeline positions depending on git_strategy:
#   direct:    before git push (ESO resolves immediately after ArgoCD sync)
#   branch_pr: after PR merge (secrets only enter Vault once approved)

- name: "Authenticate to Vault with root token"
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/auth/token/lookup-self"
    method: GET
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    validate_certs: false
    status_code: 200
  register: _vault_auth_check
  delegate_to: localhost

# The pull secret and SSH key live at global paths populated during hub bootstrap.
# Verify they are present before proceeding — the InfrastructureEnv depends on them.
- name: "Verify global pull-secret exists in Vault"
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/{{ cluster.pull_secret_vault_path | regex_replace('^secret/', 'secret/data/') }}"
    method: GET
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    validate_certs: false
    status_code: 200
  register: _pull_secret_check
  delegate_to: localhost
  failed_when: _pull_secret_check.status != 200

# Load spoke-specific cluster secrets into Vault under secret/<cluster_name>/.
# The values-secret.yaml.template defines what fields to populate.
# Here we write the per-cluster secrets derived from the cluster definition.
- name: "Write spoke cluster metadata to Vault"
  ansible.builtin.uri:
    url: >-
      {{ vault_addr }}/v1/{{ cluster.cluster_vault_path_prefix
      | regex_replace('^secret/', 'secret/data/') }}/cluster-info
    method: POST
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      data:
        cluster_name: "{{ cluster.name }}"
        base_domain: "{{ cluster.base_domain }}"
        api_url: "https://api.{{ cluster.name }}.{{ cluster.base_domain }}:6443"
        console_url: "https://console-openshift-console.apps.{{ cluster.name }}.{{ cluster.base_domain }}"
    validate_certs: false
    status_code: [200, 204]
  delegate_to: localhost

# Write per-node BMC passwords so ACM can use them for ZTP if needed.
- name: "Write BMC credentials for {{ item.hostname }} to Vault"
  ansible.builtin.uri:
    url: >-
      {{ vault_addr }}/v1/{{ cluster.cluster_vault_path_prefix
      | regex_replace('^secret/', 'secret/data/') }}/bmc-{{ item.hostname }}
    method: POST
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      data:
        username: "{{ item.bmc.user }}"
        password: "{{ item.bmc.password }}"
        address: "{{ item.bmc.ip }}"
    validate_certs: false
    status_code: [200, 204]
  delegate_to: localhost
  loop: "{{ nodes }}"
  loop_control:
    label: "{{ item.hostname }}"
  no_log: true

- name: "Vault secret load complete for cluster {{ cluster.name }}"
  ansible.builtin.debug:
    msg: >-
      Spoke secrets loaded at {{ cluster.cluster_vault_path_prefix }}.
      ExternalSecrets on hub will sync on next refresh.
