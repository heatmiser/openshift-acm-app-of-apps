---
# === START REGISTRATION LISTENER ===
# Install FastAPI listener dependencies and start the uvicorn process in the
# background. Subsequent tasks boot nodes and drain the registration queue.

- name: "Ensure pip is available for listener dependencies"
  ansible.builtin.package:
    name: python3-pip
    state: present
  become: true

- name: "Install registration listener Python dependencies"
  ansible.builtin.pip:
    requirements: "{{ playbook_dir }}/../listener/requirements.txt"
    state: present
    extra_args: "--quiet"

- name: "Start registration listener in background"
  ansible.builtin.command:
    cmd: >-
      uvicorn registration_listener:app
      --host 0.0.0.0
      --port {{ cluster_onboard_listener_port }}
      --log-level warning
    chdir: "{{ playbook_dir }}/../listener"
  async: "{{ cluster_onboard_listener_timeout + 120 }}"
  poll: 0
  register: _listener_job
  changed_when: true

# Wait until the listener is accepting connections before booting nodes.
- name: "Wait for registration listener to become ready"
  ansible.builtin.uri:
    url: >-
      http://{{ cluster_onboard_listener_host }}:{{ cluster_onboard_listener_port }}/healthz
    method: GET
    status_code: 200
  register: _healthz
  until: _healthz.status == 200
  retries: 15
  delay: 2
  delegate_to: localhost

- name: "Registration listener is ready"
  ansible.builtin.debug:
    msg: >-
      Listener accepting registrations at
      http://{{ cluster_onboard_listener_host }}:{{ cluster_onboard_listener_port }}
