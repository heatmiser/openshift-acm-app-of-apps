---
# === ISO STAGING ===
# Transfers the agent ISO to the HTTP staging server so iDRAC can stream it as
# virtual media. Optionally moves it into tmpfs (/dev/shm) for faster streaming
# and creates a symlink from the docroot.
#
# Runs in http_servers play context.

- name: "Ensure HTTP docroot directory exists"
  ansible.builtin.file:
    path: "{{ remote_http_iso_dir }}"
    state: directory
    mode: "0755"

# ansible.posix.synchronize uses rsync: controller pushes to the http_servers host
- name: "Synchronize agent ISO to HTTP server"
  ansible.posix.synchronize:
    src: "{{ agent_iso_local_path }}"
    dest: "{{ remote_http_iso_dir }}/{{ agent_iso_filename }}"
    mode: push
    checksum: true
  register: iso_sync_result

- name: "Stage ISO in tmpfs for faster iDRAC streaming"
  when: iso_use_tmpfs | bool
  block:
    - name: "Ensure tmpfs staging directory exists"
      ansible.builtin.file:
        path: "{{ tmpfs_path }}"
        state: directory
        mode: "0755"

    - name: "Copy ISO to tmpfs"
      ansible.builtin.copy:
        src: "{{ remote_http_iso_dir }}/{{ agent_iso_filename }}"
        dest: "{{ tmpfs_path }}/{{ agent_iso_filename }}"
        remote_src: true
        mode: "0644"

    # Replace the docroot copy with a symlink to the tmpfs version
    - name: "Symlink docroot ISO to tmpfs"
      ansible.builtin.file:
        src: "{{ tmpfs_path }}/{{ agent_iso_filename }}"
        dest: "{{ remote_http_iso_dir }}/{{ agent_iso_filename }}"
        state: link
        force: true

- name: "Set SELinux context on HTTP docroot"
  community.general.sefcontext:
    target: "{{ remote_http_iso_dir }}(/.*)?"
    setype: httpd_sys_content_t
    state: present

- name: "Restore SELinux contexts on HTTP docroot"
  ansible.builtin.command:
    argv:
      - restorecon
      - "-Rv"
      - "{{ remote_http_iso_dir }}"
  register: restorecon_result
  changed_when: restorecon_result.stdout | length > 0
