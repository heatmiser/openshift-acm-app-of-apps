---
# === LIVE ISO DISCOVERY REPORT ===
# Formats and displays discovered hardware facts to the console after the
# registration queue has been drained.
#
# In hub mode, results are correlated with Redfish serial numbers to match
# callbacks to inventory hostnames. In listener-only mode (skip_bmc_boot=true),
# raw callback data is displayed without inventory correlation.
#
# Variables consumed:
#   _drain_results        — registered output from drain_registration_queue.yml
#   _hub_serial_to_host   — serial → hostname lookup (hub mode only)
#   skip_bmc_boot         — bool; true means no Redfish data available
#   _discovery_start_time — set before listener start for elapsed time display

# --- Build per-node result list ---
- name: "Build discovery result list"
  ansible.builtin.set_fact:
    _discovery_results: >-
      {% set results = [] %}
      {% for item in _drain_results.results %}
      {% if item.json is not none %}
      {% set node = {
        'serial': item.json.serial,
        'ip': item.json.ip,
        'mac': item.json.mac,
        'interface': item.json.interface
      } %}
      {% if not (skip_bmc_boot | default(false) | bool) and _hub_serial_to_host is defined %}
        {% set hostname = _hub_serial_to_host.get(item.json.serial, 'UNMATCHED') %}
        {% set _ = node.update({'hostname': hostname,
                                'correlated': hostname != 'UNMATCHED'}) %}
      {% else %}
        {% set _ = node.update({'hostname': 'N/A (listener-only mode)',
                                'correlated': false}) %}
      {% endif %}
      {% set _ = results.append(node) %}
      {% endif %}
      {% endfor %}
      {{ results }}

# --- Count results ---
- name: "Calculate discovery summary counts"
  ansible.builtin.set_fact:
    _registered_count: "{{ _drain_results.results | selectattr('json', 'ne', none) | list | length }}"
    _correlated_count: >-
      {{ _discovery_results | selectattr('correlated', 'equalto', true) | list | length
         if not (skip_bmc_boot | default(false) | bool) else 'N/A' }}
    _unmatched_count: >-
      {{ _discovery_results | selectattr('correlated', 'equalto', false) | list | length
         if not (skip_bmc_boot | default(false) | bool) else 'N/A' }}

# --- Per-node output ---
- name: "Discovery result — {{ item.hostname }} ({{ item.serial }})"
  ansible.builtin.debug:
    msg: >-
      ┌─ Node {{ idx + 1 }} of {{ _registered_count }} ───────────────────────────
      │  Inventory host : {{ item.hostname }}
      │  Serial         : {{ item.serial }}
      │  DHCP IP        : {{ item.ip }}
      │  MAC address    : {{ item.mac }}
      │  Interface name : {{ item.interface }}
      │  Correlated     : {{ 'YES' if item.correlated else 'NO (serial not in Redfish data)' }}
      └────────────────────────────────────────────────────────────
  loop: "{{ _discovery_results }}"
  loop_control:
    index_var: idx
    label: "{{ item.serial }}"

# --- Summary ---
- name: "Live ISO discovery — SUMMARY"
  ansible.builtin.debug:
    msg: >-
      ╔══════════════════════════════════════════════════════════════╗
      ║              LIVE ISO DISCOVERY REPORT                      ║
      ╠══════════════════════════════════════════════════════════════╣
      ║  Mode       : {{ 'listener-only (no BMC boot)' if (skip_bmc_boot | default(false) | bool) else 'full (Redfish + BMC boot)' }}
      ║  Expected   : {{ _drain_node_count }} node(s)
      ║  Registered : {{ _registered_count }} node(s)
      ║  Correlated : {{ _correlated_count }}
      ║  Unmatched  : {{ _unmatched_count }}
      ╠══════════════════════════════════════════════════════════════╣
      {% if _registered_count | int == _drain_node_count | int %}
      ║  STATUS: ALL NODES REGISTERED SUCCESSFULLY                  ║
      {% else %}
      ║  STATUS: WARNING — NOT ALL NODES REGISTERED                 ║
      {% endif %}
      ╠══════════════════════════════════════════════════════════════╣
      ║  Next steps:                                                ║
      ║    Hub install  → ansible-playbook playbooks/bare_metal_prep.yml
      ║    Spoke onboard → ansible-playbook playbooks/cluster_onboard.yml
      ╚══════════════════════════════════════════════════════════════╝

- name: "Fail if not all nodes registered"
  ansible.builtin.fail:
    msg: >-
      Only {{ _registered_count }} of {{ _drain_node_count }} expected nodes
      registered. Check that the Live ISO booted successfully on all nodes and
      that the DNS SRV record ({{ cluster_onboard_mdns_service_name }}.{{
      cluster_onboard_dns_srv_domain }}) resolves to this controller.
  when: _registered_count | int < _drain_node_count | int

- name: "Fail if unmatched nodes detected (hub mode)"
  ansible.builtin.fail:
    msg: >-
      {{ _unmatched_count }} node(s) registered but could not be correlated to
      an inventory host by serial number. Redfish discovery may have failed for
      one or more nodes, or the serial numbers reported by dmidecode do not match
      those returned by the Redfish API.
  when:
    - not (skip_bmc_boot | default(false) | bool)
    - _unmatched_count | int > 0
