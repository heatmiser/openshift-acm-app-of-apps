---
# === TEMPLATE RENDERING ===
# Render all Jinja2 cluster templates into clusters/<name>/. Also patches
# clusters/cluster-versions.yaml and clusters/hub/values.yaml so ArgoCD picks
# up the new cluster at its next sync.

- name: "Ensure SSH public key is available for template rendering"
  ansible.builtin.set_fact:
    cluster_ssh_public_key: >-
      {{ lookup('hashi_vault',
           'secret=' ~ cluster.ssh_key_vault_path ~ ':ssh_public_key
            url=http://localhost:8200
            auth_method=token
            token=' ~ vault_root_token) }}

# --- Create output directory structure ---
- name: "Ensure clusters/{{ cluster.name }}/ directory exists"
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../../clusters/{{ cluster.name }}"
    state: directory
    mode: "0755"

- name: "Ensure clusters/{{ cluster.name }}/nodes/ directory exists"
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../../clusters/{{ cluster.name }}/nodes"
    state: directory
    mode: "0755"

# --- Render top-level manifests ---
- name: "Render clusters/{{ cluster.name }}/kustomization.yaml"
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/clusters/kustomization.yaml.j2"
    dest: "{{ playbook_dir }}/../../clusters/{{ cluster.name }}/kustomization.yaml"
    mode: "0644"

- name: "Render clusters/{{ cluster.name }}/clusterdeployment.yaml"
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/clusters/clusterdeployment.yaml.j2"
    dest: "{{ playbook_dir }}/../../clusters/{{ cluster.name }}/clusterdeployment.yaml"
    mode: "0644"

- name: "Render clusters/{{ cluster.name }}/agentclusterinstall.yaml"
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/clusters/agentclusterinstall.yaml.j2"
    dest: "{{ playbook_dir }}/../../clusters/{{ cluster.name }}/agentclusterinstall.yaml"
    mode: "0644"

- name: "Render clusters/{{ cluster.name }}/infraenv.yaml"
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/clusters/infraenv.yaml.j2"
    dest: "{{ playbook_dir }}/../../clusters/{{ cluster.name }}/infraenv.yaml"
    mode: "0644"

- name: "Render clusters/{{ cluster.name }}/externalsecret-pull-secret.yaml"
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/clusters/externalsecret-pull-secret.yaml.j2"
    dest: >-
      {{ playbook_dir }}/../../clusters/{{ cluster.name }}/externalsecret-pull-secret.yaml
    mode: "0644"

# --- Render per-node NMStateConfig manifests ---
- name: "Render NMStateConfig for {{ item.hostname }}"
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/clusters/node-nmstate.yaml.j2"
    dest: >-
      {{ playbook_dir }}/../../clusters/{{ cluster.name
      }}/nodes/{{ item.hostname }}-nmstate.yaml
    mode: "0644"
  vars:
    node: "{{ item }}"
  loop: "{{ nodes }}"
  loop_control:
    label: "{{ item.hostname }}"

- name: "Render clusters/{{ cluster.name }}/nodes/kustomization.yaml"
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/clusters/nodes-kustomization.yaml.j2"
    dest: "{{ playbook_dir }}/../../clusters/{{ cluster.name }}/nodes/kustomization.yaml"
    mode: "0644"

# --- Patch cluster-versions.yaml ---
# Adds:  <cluster.name>: <cluster.git_branch>  to the ConfigMap data section.
- name: "Add {{ cluster.name }} entry to clusters/cluster-versions.yaml"
  ansible.builtin.lineinfile:
    path: "{{ playbook_dir }}/../../clusters/cluster-versions.yaml"
    insertafter: "^data:"
    line: "  {{ cluster.name }}: {{ cluster.git_branch }}"
    state: present

# --- Patch clusters/hub/values.yaml ---
# Appends the new cluster's Application entry under the Wave 25 section.
- name: "Add {{ cluster.name }} Application to clusters/hub/values.yaml"
  ansible.builtin.blockinfile:
    path: "{{ playbook_dir }}/../../clusters/hub/values.yaml"
    block: "{{ lookup('template', playbook_dir ~ '/../templates/clusters/hub-values-entry.yaml.j2') }}"
    marker: "# {mark} CLUSTER {{ cluster.name | upper }} APPLICATION"
    insertbefore: EOF

- name: "Template rendering complete for cluster {{ cluster.name }}"
  ansible.builtin.debug:
    msg: >-
      Rendered manifests in clusters/{{ cluster.name }}/ and patched
      cluster-versions.yaml and clusters/hub/values.yaml.
