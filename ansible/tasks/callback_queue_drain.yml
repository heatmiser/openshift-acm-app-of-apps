---
# === CALLBACK QUEUE DRAIN ===
# Boot all nodes in parallel via BMC virtual media, then drain the registration
# queue as each node POSTs its callback. Nodes are processed as they arrive —
# all three can boot concurrently and Ansible handles each one as it registers.

# --- Mount discovery live ISO on all BMCs in parallel ---
- name: "Mount hardware discovery ISO on {{ item.hostname }} via iDRAC virtual media"
  community.general.redfish_command:
    category: Manager
    command: VirtualMediaInsert
    baseuri: "{{ item.bmc.ip }}"
    username: "{{ item.bmc.user }}"
    password: "{{ item.bmc.password }}"
    virtual_media:
      image_url: "{{ cluster_onboard_live_iso_url }}"
      media_types:
        - CD
      inserted: true
      write_protected: true
    resource_id: iDRAC.Embedded.1
  delegate_to: localhost
  loop: "{{ nodes }}"
  loop_control:
    label: "{{ item.hostname }}"

# --- Set one-time boot from virtual CD-ROM ---
- name: "Set one-time UEFI boot from virtual CD-ROM on {{ item.hostname }}"
  community.general.redfish_command:
    category: Systems
    command: SetOneTimeBoot
    baseuri: "{{ item.bmc.ip }}"
    username: "{{ item.bmc.user }}"
    password: "{{ item.bmc.password }}"
    bootdevice: Cd
  delegate_to: localhost
  loop: "{{ nodes }}"
  loop_control:
    label: "{{ item.hostname }}"

# --- Power cycle all nodes — async (fire and forget, do not wait) ---
- name: "Power cycle {{ item.hostname }} to boot from discovery ISO"
  community.general.redfish_command:
    category: Systems
    command: PowerGracefulRestart
    baseuri: "{{ item.bmc.ip }}"
    username: "{{ item.bmc.user }}"
    password: "{{ item.bmc.password }}"
  delegate_to: localhost
  loop: "{{ nodes }}"
  loop_control:
    label: "{{ item.hostname }}"
  ignore_errors: true
  register: _graceful_restart

# Fallback: power on nodes that were already off (GracefulRestart returns error
# when the system is powered off).
- name: "Power on {{ item.item.hostname }} (was already off)"
  community.general.redfish_command:
    category: Systems
    command: PowerOn
    baseuri: "{{ item.item.bmc.ip }}"
    username: "{{ item.item.bmc.user }}"
    password: "{{ item.item.bmc.password }}"
  delegate_to: localhost
  loop: "{{ _graceful_restart.results }}"
  loop_control:
    label: "{{ item.item.hostname }}"
  when: item.failed | bool

# --- Drain registration queue ---
- name: "Drain node registration callbacks ({{ nodes | length }} nodes expected)"
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/../tasks/drain_registration_queue.yml"
  vars:
    _drain_node_count: "{{ nodes | length }}"
