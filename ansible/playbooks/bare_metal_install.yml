---
# bare_metal_install.yml
#
# Phase 1b: Power cycle hub nodes and wait for OpenShift installation to complete.
#
# Run after bare_metal_prep.yml. The agent ISO must already be mounted on each
# node's iDRAC before this playbook is run.
#
# Usage:
#   ansible-playbook playbooks/bare_metal_install.yml --ask-vault-pass

- name: "Power cycle hub nodes to boot from virtual CD-ROM"
  hosts: hub_nodes
  gather_facts: false
  vars_files:
    - "../vars/acm_config.yml"
    - "../vars/vault_secrets.yml"
  tasks:
    - name: "BMC power cycle"
      ansible.builtin.include_role:
        name: acm_bmc
        tasks_from: power_control

- name: "Wait for OpenShift agent-based installation to complete"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "../vars/acm_config.yml"
  tasks:
    - name: "Poll for install-complete"
      ansible.builtin.include_role:
        name: acm_iso_build
        tasks_from: wait
