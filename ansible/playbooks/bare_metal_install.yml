---
# bare_metal_install.yml
#
# Phase 1b: Power cycle hub nodes and wait for OpenShift installation to complete.
#
# Plays (in order):
#   1. hub_nodes  — Set one-time UEFI CD boot override; power cycle each node
#   2. localhost  — Poll openshift-install agent wait-for install-complete
#
# Run after bare_metal_prep.yml has completed successfully. The nodes must have
# virtual media mounted and the agent ISO staged before this playbook is run.
#
# The installer writes cluster credentials to:
#   {{ install_dir }}/auth/kubeconfig
#   {{ install_dir }}/auth/kubeadmin-password
#
# Usage:
#   ansible-playbook playbooks/bare_metal_install.yml --ask-vault-pass

- name: "Power cycle hub nodes to boot from virtual CD-ROM"
  hosts: hub_nodes
  gather_facts: false
  vars_files:
    - "../vars/acm_config.yml"
    - "../vars/vault_secrets.yml"
  tasks:
    - name: "Include BMC power control tasks"
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../tasks/bmc_power_control.yml"

- name: "Wait for OpenShift agent-based installation to complete"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "../vars/acm_config.yml"
  tasks:
    - name: "Include installation wait tasks"
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../tasks/wait_for_install.yml"
