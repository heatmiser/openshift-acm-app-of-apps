---
# acm_hub_bootstrap.yml
#
# Phase 2a: Bootstrap OpenShift GitOps and ArgoCD on the newly installed hub cluster.
#
# Run after bare_metal_install.yml has completed successfully.
#
# Usage:
#   ansible-playbook playbooks/acm_hub_bootstrap.yml

- name: "Bootstrap OpenShift GitOps and ArgoCD on hub cluster"
  hosts: localhost
  connection: local
  gather_facts: false
  environment:
    KUBECONFIG: "{{ install_dir }}/auth/kubeconfig"
  vars_files:
    - "../vars/acm_config.yml"
  tasks:
    - name: "Verify cluster API is reachable"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
        name: default
      register: api_check
      until: api_check.resources | length > 0
      retries: 10
      delay: 15

    - name: "Deploy GitOps operator and ArgoCD root application"
      ansible.builtin.include_role:
        name: acm_platform
        tasks_from: gitops
