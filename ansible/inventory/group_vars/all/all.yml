---
# =============================================================================
# OpenShift installation
# =============================================================================
openshift_version: "4.21"
openshift_install_binary: "/usr/local/bin/openshift-install"
install_base_dir: "/opt/openshift-install"
install_dir: "{{ install_base_dir }}/{{ cluster_name }}"

# =============================================================================
# Agent ISO
# =============================================================================
# Generated by openshift-install agent create image; filename is fixed by the
# installer. Staged on the HTTP server for BMC virtual media mount.
agent_iso_filename: "agent.x86_64.iso"
agent_iso_local_path: "{{ install_dir }}/{{ agent_iso_filename }}"

# =============================================================================
# HTTP staging server
# =============================================================================
http_server_base_url: >-
  http://{{ hostvars[groups['http_servers'][0]]['ansible_host'] }}
remote_http_docroot: "/var/www/html/ocp"
remote_http_iso_dir: "{{ remote_http_docroot }}/{{ cluster_name }}"
agent_iso_url: "{{ http_server_base_url }}/{{ cluster_name }}/{{ agent_iso_filename }}"
