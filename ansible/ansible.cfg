[defaults]
inventory = inventory/
roles_path = roles
collections_paths = ~/.ansible/collections
host_key_checking = False
pipelining = True
forks = 10
stdout_callback = yaml
callbacks_enabled = profile_tasks

[privilege_escalation]
become = False
become_method = sudo

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
