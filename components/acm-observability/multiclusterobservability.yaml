---
# MultiClusterObservability deploys Thanos + Grafana + Alertmanager on the hub.
# Requires the MultiClusterHub to be Running (wave 15) and an object storage
# bucket to be available (provisioned by the ObjectBucketClaim above).
#
# The thanos-object-storage Secret is managed by ESO via an ExternalSecret
# that reads from Vault path secret/hub/thanos-object-storage and must exist
# before this CR reaches the Configured state.
apiVersion: observability.open-cluster-management.io/v1beta2
kind: MultiClusterObservability
metadata:
  name: observability
  namespace: open-cluster-management-observability
spec:
  enableDownsampling: true

  observabilityAddonSpec:
    enableMetrics: true
    interval: 30

  storageConfig:
    metricObjectStorage:
      name: thanos-object-storage
      key: thanos.yaml
    statefulSetSize: 10Gi
    statefulSetStorageClass: gp3-csi

  advanced:
    retentionConfig:
      blockDuration: 2h
      deleteDelay: 48h
      retentionInLocal: 5d
      retentionResolutionRaw: 30d
      retentionResolution5m: 180d
      retentionResolution1h: 0d
