---
# ClusterSecretStore points at the Vault instance running on this hub cluster.
# ESO uses the openshift-gitops service account token (Kubernetes auth method)
# to authenticate to Vault. The Kubernetes auth role and policy are created by
# ansible/tasks/vault_init.yml before this store becomes Ready.
#
# Vault KV v2 path layout:
#   secret/global/   — shared across all clusters
#   secret/hub/      — hub-cluster-specific
#   secret/{fqdn}/   — per-spoke-cluster
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "hub"
          role: "eso-reader"
          serviceAccountRef:
            name: openshift-gitops-argocd-application-controller
            namespace: openshift-gitops
